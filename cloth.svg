<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- 1960s speaker cloth: dark woven fabric with gold lurex threads -->
  <filter id="c" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5" result="n"/>
    <feColorMatrix in="n" type="matrix"
      values="0.22 0 0 0 0.02
              0.17 0 0 0 0.015
              0.10 0 0 0 0.01
              0    0 0 0 1"/>
  </filter>
  <pattern id="weave" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="2" fill="rgba(0,0,0,0.35)"/>
    <rect width="2" height="4" fill="rgba(255,235,190,0.05)"/>
  </pattern>
  <pattern id="lurex" width="12" height="9" patternUnits="userSpaceOnUse">
    <rect y="4" width="12" height="1" fill="rgba(214,178,98,0.35)"/>
  </pattern>
  <rect width="240" height="240" filter="url(#c)"/>
  <rect width="240" height="240" fill="url(#weave)"/>
  <rect width="240" height="240" fill="url(#lurex)"/>
</svg>
