<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" preserveAspectRatio="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- walnut veneer: long horizontal grain + slow figure + fine pores -->
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.0035 0.09" numOctaves="5" seed="11" result="g"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.0012 0.012" numOctaves="2" seed="3" result="f"/>
    <feComposite in="g" in2="f" operator="arithmetic" k1="0" k2="0.75" k3="0.45" k4="-0.12" result="m"/>
    <feColorMatrix in="m" type="matrix"
      values="0.62 0 0 0 0.05
              0.36 0 0 0 0.02
              0.17 0 0 0 0.005
              0    0 0 0 1"/>
  </filter>
  <rect width="900" height="600" filter="url(#grain)"/>
</svg>
